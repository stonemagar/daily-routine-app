<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Makes the page responsive on phones and tablets -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Controls the browser and installed PWA theme colour -->
    <meta name="theme-color" content="#111827" />

    <meta
      name="description"
      content="A mobile-friendly app for creating and tracking daily routines."
    />

    <title>Daily Routine App</title>

    <!-- Bootstrap provides responsive layout and reusable UI styles -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Custom styles for this application -->
    <link rel="stylesheet" href="css/style.css" />

    <!-- PWA settings used when the app is installed -->
    <link rel="manifest" href="manifest.json" />

    <!-- App icon displayed in the browser tab -->
    <link rel="icon" type="image/png" href="assets/icons/icon-192.png" />
  </head>

  <body>
    <div class="app-shell">
      <!-- ==================================================
           APP HEADER
           Displays the app name and dark-mode control
      =================================================== -->

      <header class="app-header">
        <div>
          <p class="eyebrow">Daily planner</p>
          <h1>My Routine Update Test</h1>
        </div>

        <button id="themeToggle" class="icon-button" type="button">
          Dark mode
        </button>
      </header>

      <!-- ==================================================
     APP UPDATE BANNER
     Appears when a newer version is ready to install
=================================================== -->

      <section
        id="updateBanner"
        class="update-banner d-none"
        role="status"
        aria-live="polite"
      >
        <div>
          <strong>New version available</strong>
          <p>Update now to use the latest improvements.</p>
        </div>

        <div class="update-banner-actions">
          <button id="updateNowButton" class="primary-button" type="button">
            Update now
          </button>

          <button
            id="dismissUpdateButton"
            class="btn btn-outline-secondary"
            type="button"
          >
            Later
          </button>
        </div>
      </section>

      <main>
        <!-- ==================================================
             TODAY'S PROGRESS
             Displays the current date and completion percentage
        =================================================== -->

        <section class="summary-card">
          <div>
            <p>Today</p>
            <h2 id="todayDate">Loading date...</h2>
          </div>

          <div class="progress-box">
            <span id="progressText">0 of 0 completed</span>
            <strong id="progressPercent">0%</strong>
          </div>
        </section>

        <!-- ==================================================
             ROUTINE FORM
             Allows the user to add or edit a routine
        =================================================== -->

        <section class="routine-form-card">
          <div class="section-heading">
            <div>
              <p class="eyebrow">New activity</p>
              <h2>Add routine</h2>
            </div>
          </div>

          <form id="routineForm">
            <!-- Routine name -->
            <div class="form-group">
              <label for="title">Activity name</label>

              <input
                id="title"
                name="title"
                type="text"
                placeholder="Example: Study Python"
                maxlength="100"
                required
              />
            </div>

            <!-- Routine start and end times -->
            <div class="form-row">
              <div class="form-group">
                <label for="startTime">Start time</label>

                <input id="startTime" name="startTime" type="time" required />
              </div>

              <div class="form-group">
                <label for="endTime">End time</label>

                <input id="endTime" name="endTime" type="time" required />
              </div>
            </div>

            <!-- Routine category and repeating weekdays -->
            <div class="form-row">
              <div class="form-group">
                <label for="category">Category</label>

                <select id="category" name="category">
                  <option value="Study">Study</option>
                  <option value="Work">Work</option>
                  <option value="Health">Health</option>
                  <option value="Personal">Personal</option>
                  <option value="Meal">Meal</option>
                  <option value="Sleep">Sleep</option>
                </select>
              </div>

              <div class="form-group">
                <span class="form-label">Select days</span>

                <div class="weekday-grid">
                  <label class="weekday-option">
                    <input type="checkbox" name="days" value="Monday" />
                    Monday
                  </label>

                  <label class="weekday-option">
                    <input type="checkbox" name="days" value="Tuesday" />
                    Tuesday
                  </label>

                  <label class="weekday-option">
                    <input type="checkbox" name="days" value="Wednesday" />
                    Wednesday
                  </label>

                  <label class="weekday-option">
                    <input type="checkbox" name="days" value="Thursday" />
                    Thursday
                  </label>

                  <label class="weekday-option">
                    <input type="checkbox" name="days" value="Friday" />
                    Friday
                  </label>

                  <label class="weekday-option">
                    <input type="checkbox" name="days" value="Saturday" />
                    Saturday
                  </label>

                  <label class="weekday-option">
                    <input type="checkbox" name="days" value="Sunday" />
                    Sunday
                  </label>
                </div>

                <!-- Hidden until the user submits without selecting a day -->
                <small id="dayError" class="text-danger d-none">
                  Select at least one day.
                </small>
              </div>
            </div>

            <!-- ==================================================
     ROUTINE DETAILS

     Notes store extra information about the activity.
     Priority shows how important the routine is.
================================================== -->

            <div class="form-row">
              <div class="form-group">
                <label for="notes">Notes</label>

                <textarea
                  id="notes"
                  name="notes"
                  class="form-control"
                  rows="3"
                  maxlength="300"
                  placeholder="Example: Bring laptop and charger"
                ></textarea>
              </div>

              <div class="form-group">
                <label for="priority">Priority</label>

                <select id="priority" name="priority" class="form-select">
                  <option value="Low">Low</option>
                  <option value="Medium" selected>Medium</option>
                  <option value="High">High</option>
                </select>
              </div>
            </div>

            <!-- Add, update, and cancel controls -->
            <div class="form-actions">
              <button id="submitButton" class="primary-button" type="submit">
                Add routine
              </button>

              <button
                id="cancelEditButton"
                class="btn btn-outline-secondary d-none"
                type="button"
              >
                Cancel edit
              </button>
            </div>
          </form>
        </section>

        <!-- ==================================================
             ROUTINE LIST
             Displays, searches, and filters saved routines
        =================================================== -->

        <section class="routine-list-card">
          <div class="section-heading">
            <div>
              <p class="eyebrow">Schedule</p>
              <h2>My routines</h2>
            </div>
          </div>

          <!-- Search and filter controls -->
          <div class="routine-filter-panel">
            <!-- Search routine names -->
            <div class="form-group">
              <label for="searchInput">Search routines</label>

              <input
                id="searchInput"
                class="form-control"
                type="search"
                placeholder="Search by activity name"
                autocomplete="off"
              />
            </div>

            <!-- Filter by day -->
            <div class="form-group">
              <label for="dayFilter">Day</label>

              <select id="dayFilter" class="form-select">
                <option value="Today">Today</option>
                <option value="Monday">Monday</option>
                <option value="Tuesday">Tuesday</option>
                <option value="Wednesday">Wednesday</option>
                <option value="Thursday">Thursday</option>
                <option value="Friday">Friday</option>
                <option value="Saturday">Saturday</option>
                <option value="Sunday">Sunday</option>
                <option value="All">All days</option>
              </select>
            </div>

            <!-- Filter by category -->
            <div class="form-group">
              <label for="categoryFilter">Category</label>

              <select id="categoryFilter" class="form-select">
                <option value="All">All categories</option>
                <option value="Study">Study</option>
                <option value="Work">Work</option>
                <option value="Health">Health</option>
                <option value="Personal">Personal</option>
                <option value="Meal">Meal</option>
                <option value="Sleep">Sleep</option>
              </select>
            </div>

            <!-- Reset all filters to their defaults -->
            <div class="form-group filter-button-group">
              <span class="form-label">Actions</span>

              <button
                id="clearFiltersButton"
                class="btn btn-outline-secondary"
                type="button"
              >
                Clear filters
              </button>
            </div>
          </div>

          <!-- Backup controls -->
          <div class="backup-toolbar">
            <button
              id="exportButton"
              class="btn btn-outline-primary btn-sm"
              type="button"
            >
              Export backup
            </button>

            <button
              id="importButton"
              class="btn btn-outline-secondary btn-sm"
              type="button"
            >
              Import backup
            </button>

            <!-- Hidden file input opened by the Import button -->
            <input
              id="importFile"
              type="file"
              accept=".json,application/json"
              hidden
            />
          </div>

          <!-- JavaScript inserts routine cards into this container -->
          <div id="routineList" class="routine-list" aria-live="polite">
            <p class="empty-state">No routines added yet.</p>
          </div>
        </section>
      </main>
    </div>

    <!-- Bootstrap JavaScript components -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Main application logic -->
    <script src="js/app.js"></script>
  </body>
</html>
