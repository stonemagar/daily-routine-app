<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111827" />

    <title>Daily Routine App</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="manifest" href="manifest.json" />
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <div>
          <p class="eyebrow">Daily planner</p>
          <h1>My Routine</h1>
        </div>

        <button id="themeToggle" class="icon-button" type="button">
          Dark mode
        </button>
      </header>

      <main>
        <section class="summary-card">
          <div>
            <p>Today</p>
            <h2 id="todayDate">Loading date...</h2>
          </div>

          <div class="progress-box">
            <span id="progressText">0 of 0 completed</span>
            <strong id="progressPercent">0%</strong>
          </div>
        </section>

        <section class="routine-form-card">
          <div class="section-heading">
            <div>
              <p class="eyebrow">New activity</p>
              <h2>Add routine</h2>
            </div>
          </div>

          <form id="routineForm">
            <div class="form-group">
              <label for="title">Activity name</label>
              <input
                id="title"
                name="title"
                type="text"
                placeholder="Example: Study Python"
                required
              />
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="startTime">Start time</label>
                <input id="startTime" name="startTime" type="time" required />
              </div>

              <div class="form-group">
                <label for="endTime">End time</label>
                <input id="endTime" name="endTime" type="time" required />
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="category">Category</label>
                <select id="category" name="category">
                  <option value="Study">Study</option>
                  <option value="Work">Work</option>
                  <option value="Health">Health</option>
                  <option value="Personal">Personal</option>
                  <option value="Meal">Meal</option>
                  <option value="Sleep">Sleep</option>
                </select>
              </div>

              <div class="form-group">
                <label>Select days</label>

                <div class="weekday-grid">
                  <label class="weekday-option">
                    <input type="checkbox" name="days" value="Monday" />
                    Monday
                  </label>

                  <label class="weekday-option">
                    <input type="checkbox" name="days" value="Tuesday" />
                    Tuesday
                  </label>

                  <label class="weekday-option">
                    <input type="checkbox" name="days" value="Wednesday" />
                    Wednesday
                  </label>

                  <label class="weekday-option">
                    <input type="checkbox" name="days" value="Thursday" />
                    Thursday
                  </label>

                  <label class="weekday-option">
                    <input type="checkbox" name="days" value="Friday" />
                    Friday
                  </label>

                  <label class="weekday-option">
                    <input type="checkbox" name="days" value="Saturday" />
                    Saturday
                  </label>

                  <label class="weekday-option">
                    <input type="checkbox" name="days" value="Sunday" />
                    Sunday
                  </label>
                </div>

                <small id="dayError" class="text-danger d-none">
                  Select at least one day.
                </small>
              </div>
            </div>
            <button class="primary-button" type="submit">Add routine</button>
          </form>
        </section>

        <section class="routine-list-card">
          <div class="section-heading">
            <div>
              <p class="eyebrow">Schedule</p>
              <h2>Today’s routines</h2>
            </div>

            <div class="d-flex flex-wrap gap-2 w-100 justify-content-between">
              <select
                id="dayFilter"
                class="form-select w-auto"
                aria-label="Filter by day"
              >
                <option value="Today">Today</option>
                <option value="Monday">Monday</option>
                <option value="Tuesday">Tuesday</option>
                <option value="Wednesday">Wednesday</option>
                <option value="Thursday">Thursday</option>
                <option value="Friday">Friday</option>
                <option value="Saturday">Saturday</option>
                <option value="Sunday">Sunday</option>
                <option value="All">All</option>
              </select>

              <button
                id="exportButton"
                class="btn btn-outline-primary btn-sm"
                type="button"
              >
                Export backup
              </button>

              <button
                id="importButton"
                class="btn btn-outline-secondary btn-sm"
                type="button"
              >
                Import backup
              </button>

              <input
                id="importFile"
                type="file"
                accept=".json,application/json"
                hidden
              />
            </div>
          </div>

          <div id="routineList" class="routine-list">
            <p class="empty-state">No routines added yet.</p>
          </div>
        </section>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/app.js"></script>
  </body>
</html>
